# Checks on every push and PR: typecheck, tests and the web build for the dashboard, pytest for the
# preprocessor. Nothing here needs data/ (the dataset is not in the repo).
# On main, after the checks pass: push both images to GHCR, then wait until the server runs them.
# The server is never contacted except for its public /health: its update timer pulls the images
# (deploy/updater). No secrets are needed beyond the built-in GITHUB_TOKEN.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run halfway through pushing images; superseded branch runs can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_PREFIX: ghcr.io/0-chan/robot-logstream

jobs:
  dashboard:
    name: dashboard (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: dashboard/package.json # pnpm version from "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # same as the Docker image
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: build web
        run: pnpm --filter @grandtour/web build
        env:
          VITE_SERVER_URL: "" # same-origin build, as in deploy

  preprocess:
    name: preprocess (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard/preprocess
    steps:
      - uses: actions/checkout@v7
      # open3d and cadquery (OCP) load libGL/libEGL at import even without a display.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgomp1
      - uses: astral-sh/setup-uv@v10.3.3 # no moving major tag
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: dashboard/preprocess/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  images:
    name: images (push to GHCR)
    needs: [dashboard, preprocess]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          target: ${{ matrix.target }}
          platforms: linux/amd64 # Lightsail instances are x86_64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: deploy (wait for the server to run this commit)
    needs: images
    # Repo variable DEPLOY_URL, e.g. https://52-78-187-226.sslip.io. Clear it while the server is down.
    if: vars.DEPLOY_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: wait for /health to report ${{ github.sha }}
        env:
          URL: ${{ vars.DEPLOY_URL }}/health
          WANT: ${{ github.sha }}
        run: |
          # The update timer checks every minute; allow a few cycles for pull and restart.
          for i in $(seq 1 36); do
            got=$(curl -fsS --max-time 5 "$URL" | jq -r .version || true)
            echo "try $i: server runs ${got:-<no answer>}"
            [ "$got" = "$WANT" ] && exit 0
            sleep 10
          done
          echo "::error::server did not switch to $WANT within 6 minutes (check: journalctl -u robot-logstream-update)"
          exit 1
