[project]
name = "grandtour-prep"
version = "0.1.0"
description = "Convert a GrandTour sequence (Zarr-in-tar + image tars) into web-streamable files"
requires-python = ">=3.11"
dependencies = [
    "numcodecs>=0.13",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.scripts]
prep = "grandtour_prep.cli:main"
verify = "grandtour_prep.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grandtour_prep"]
