[project]
name = "grandtour-prep"
version = "0.1.0"
description = "Convert a GrandTour sequence (Zarr-in-tar + image tars) into web-streamable files"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.8.0",
    "numcodecs>=0.13",
    "numpy>=1.26",
    "open3d>=0.20.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "trimesh>=5.2.0",
]

[project.scripts]
prep = "grandtour_prep.cli:main"
verify = "grandtour_prep.verify:main"
cad-extract = "grandtour_prep.cad.extract:main"
cad-build = "grandtour_prep.cad.build:main"
localize = "grandtour_prep.localize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grandtour_prep"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
